ext-align:left;margin-top:14px}.count-line{display:flex;align-items:baseline;gap:8px}.count-line b{font-size:27px;font-weight:500}.tiny{font-size:10px;color:var(--muted)}.zero{background:var(--wash);color:var(--muted)}@media(max-width:800px){.bench{grid-template-columns:1fr;gap:20px;padding:18px 12px;justify-items:center}.intro{width:min(390px,100%)}.intro h1{font-size:28px;margin:10px 0}.intro>p,.intro .rule{display:none}.tabs{display:flex;flex-wrap:wrap;gap:4px;margin:12px 0}.tabs button{padding:9px;font-size:11px}.tabs button span{display:none}.extras{position:absolute;top:15px;right:18px}.phone{width:min(390px,100%);height:calc(100svh - 202px);min-height:510px;max-height:none;border-width:5px;border-radius:32px}.intro h1{font-size:22px;margin:8px 0}.intro h1 br{display:none}.intro h1 span{box-shadow:inset 0 -7px #e7cd78}.bench{gap:12px;padding:12px;align-content:start}.tabs{margin:8px 0 0}.tabs button{padding:8px}.extras{top:8px}.intro>p:last-child{display:none}.intro small{font-size:10px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

<body><main class="bench"><aside class="intro"><small>DESIGN STUDY · ISSUE 102</small><h1>放在哪。<br>也知道<span>还剩多少。</span></h1><p>延续当前界面，让数量成为物品的一部分。<br>先核对，再记住。</p><nav class="tabs" aria-label="原型场景" id="tabs"></nav><div id="scenario"></div><p class="rule" id="designNote"></p><div class="extras"><button id="theme">◐ 深色预览</button><button id="reset">重置演示</button></div><p style="font-size:10px;margin-top:12px">交互原型 · 使用示例数据 · 不连接云端</p></aside><section class="phone" id="phone" aria-label="小程序交互原型"><div class="status"><span>9:41</span><span aria-hidden="true">▮▮▮　▰</span></div><div class="nav"><button id="back" aria-label="返回">‹</button><b>我靠东西呢</b><span class="capsule" aria-hidden="true">•••　│　◉</span></div><div class="content" id="content"></div><footer class="dock" id="dock"></footer><div id="overlay"></div><div id="toast" role="status" aria-live="polite"></div></section></main>
<script>
'use strict';
const $=s=>document.querySelector(s), units=['件','个','包','盒','瓶','袋','支','双','套','卷','张','本','罐','只'];
const titles=['物品与数量','新建时核对','语音增减','照片归组','视频核对','异常与冲突'];
const notes=['列表直接看数量；详情保留上次确认时间。旧记录标为待核对，归零仍保留位置与证据。','数量独立于备注。只预填用户说出的数量，新建默认为 1；单位不自动换算。','先选中具体物品，再确认原值、变化和结果。原话是提议，不直接执行。','同一照片的候选由用户选择合成或分开。多框合成后使用整张照片作为证据。','先收拢线索，再确认真实件数。6 条线索不等于 6 件，原始画面始终可以展开。','版本冲突须重新确认；结果未知先核对。不会把旧的减少操作自动执行第二次。'];
const state={tab:0,view:'list',dark:false,quantity:5,unit:'包',legacy:false,voice:'subtract',target:'bath',vMode:'subtract',amount:2,photoMerged:false,photoQty:2,photoSources:2,photoMode:'combined',videoConfirmed:false,videoQty:1,videoMode:'combined',assign:['a','a','a','b','b','b'],selected:[true,true],boundary:'conflict',newQty:3,newUnit:'包',voiceSaved:false,detailRecord:null};
let toastTimer;
const art=()=>`./generic${state.dark?'-dark':''}.png`;
// Source art is an illustrative frame, never a real recognition result.
function scene(two=false,frame=0){return `<svg viewBox="0 0 320 160" role="img" aria-label="${two?'同帧两个棉柔巾包装的示意图':'棉柔巾包装的来源帧示意图'}"><rect width="320" height="160" fill="#dedac9"/><path d="M0 120H320M30 0V120M290 0V120" stroke="#bebba9" stroke-width="3"/><rect x="42" y="38" width="${two?105:135}" height="78" rx="10" fill="#fff9e9" stroke="#9a9c80"/><path d="M62 63H122M62 72H110" stroke="#a5ad89" stroke-width="5"/><path d="M75 100Q84 80 99 99Q110 83 123 100" fill="none" stroke="#7b8768" stroke-width="3"/>${two?'<rect x="170" y="38" width="105" height="78" rx="10" fill="#fff9e9" stroke="#9a9c80"/><path d="M188 63H250M188 72H237" stroke="#a5ad89" stroke-width="5"/><path d="M200 100Q210 80 225 99Q238 83 250 100" fill="none" stroke="#7b8768" stroke-width="3"/>':''}<text x="11" y="148" font-family="sans-serif" font-size="10" fill="#686f5b">来源示意 · ${frame?('00:'+String(frame).padStart(2,'0')):'同一张照片'}</text></svg>`}
function unitSelect(id,value){return `<select id="${id}" aria-label="计量单位">${units.map(u=>`<option ${value===u?'selected':''}>${u}</option>`).join('')}</select>`}
function step(id,value,min=0){return `<div class="stepper"><button data-step="${id}" data-d="-1" aria-label="减少数量">−</button><input id="${id}" aria-label="数量" type="number" inputmode="numeric" min="${min}" max="9999" step="1" value="${value}"><button data-step="${id}" data-d="1" aria-label="增加数量">+</button></div>`}
function dock(html,hint=''){ $('#dock').innerHTML=(hint?`<p class="hint">${hint}</p>`:'')+`<div class="dock-row">${html}</div><div class="home-indicator"></div>`}
const primary=(label,action,disabled=false)=>`<button class="primary" data-act="${action}" ${disabled?'disabled':''}>${label}</button>`;
const secondary=(label,action)=>`<button class="secondary" data-act="${action}">${label}</button>`;
function toast(text){clearTimeout(toastTimer);$('#toast').innerHTML=`<div class="toast">${text}</div>`;toastTimer=setTimeout(()=>$('#toast').innerHTML='',2600)}
function close(){ $('#overlay').innerHTML=''; }
function sheet(html){$('#overlay').innerHTML=`<div class="modal-backdrop"><section class="sheet" role="dialog" aria-modal="true" aria-label="核对设置"><div class="handle"></div>${html}</section></div>`;$('#overlay button, #overlay input')?.focus()}
function go(tab,view){close();if(tab!==0)state.detailRecord=null;state.tab=tab;state.view=view||'list';state.voiceSaved=false;render()}
function render(){
$('#tabs').innerHTML=titles.map((t,i)=>`<button data-tab="${i}" aria-pressed="${state.tab===i}"><span>0${i+1}</span>${t}</button>`).join('');$('#designNote').textContent=notes[state.tab];$('#phone').classList.toggle('dark',state.dark);$('#theme').textContent=state.dark?'◐ 浅色预览':'◐ 深色预览';$('#content').scrollTop=0;
$('#content').classList.toggle('voice-view',state.tab===2);$('#scenario').className='scenarios';$('#scenario').innerHTML=state.tab===2?`<select aria-label="语音演示场景" id="voiceScenario">${voiceScenarios.map(([id,n])=>`<option value="${id}" ${state.voice===id?'selected':''}>示例：${n}</option>`).join('')}</select>`:state.tab===5?`<select aria-label="异常演示场景" id="boundaryScenario">${[['conflict','家人已修改'],['unknown','网络结果未知'],['zero','数量归零'],['legacy','旧记录'],['range','数量不足']].map(([id,n])=>`<option value="${id}" ${state.boundary===id?'selected':''}>示例：${n}</option>`).join('')}</select>`:'';[renderItems,renderNew,renderVoice,renderPhoto,renderVideo,renderBoundary][state.tab]();
}
function renderItems(){if(state.view==='detail')return renderDetail();$('#content').innerHTML=`<div class="eyebrow">卫生间 / 收纳柜</div><div class="row"><h2>收纳柜</h2><span class="pill">3 条记录</span></div><p class="sub">位置和数量，一起记住。</p><button class="search" data-act="search">⌕　搜索这里的物品</button><div class="section">${[['棉柔巾','上次确认 · 今天',state.quantity+'<small> 包</small>','detail'],['洗衣液','数量尚未确认','<span class="pill warm">待核对</span>','legacy'],['备用牙刷','上次确认 · 昨天','0<small> 支</small>','zero']].map(([n,d,c,a])=>`<button class="item" data-act="${a}"><img class="thumb" src="${art()}" alt=""><div><strong>${n}</strong><small>${d}</small></div><span class="count">${c}</span></button>`).join('')}</div><p class="hint" style="margin-top:18px">数量为上次确认值，实际可能已变化。</p>`;dock(primary('按住说话 · 录入或改数量','voice')+secondary('＋','new'))}
function renderDetail(){const record=state.detailRecord||{name:'棉柔巾',quantity:state.quantity,unit:state.unit,legacy:false};const unknown=record.legacy,zero=record.quantity===0;$('#content').innerHTML=`<div class="hero-art"><img src="${art()}" alt="物品插画"></div><div class="row"><h2>${record.name}</h2><span class="pill">物品记录</span></div><p class="sub">上次记录位置　卫生间 / 收纳柜</p><div class="card section"><div class="row"><span class="section-label" style="margin:0">上次确认数量</span><button class="textbtn" data-act="edit-quantity">${unknown?'核对数量':'修改'}</button></div><div class="value-large ${unknown?'value-unknown':''}" style="margin:12px 0">${unknown?'尚未确认':record.quantity+`<small>${record.unit}</small>`}</div><p class="hint">${unknown?'这是一条旧记录，请核对后补充数量。':zero?'目前没有，记录和位置仍然保留。':'今天 09:32 确认 · 实际数量可能已变化'}</p></div>${unknown?'<details><summary>查看原备注</summary><p class="hint">×3　500ml，放在最下层</p><p class="hint">原备注保留，不作为当前数量。</p></details>':''}<div class="card section"><div class="row"><h3>照片与视频</h3><span class="pill">历史证据</span></div><div class="frame" style="margin-top:12px"><div class="scene">${scene(false)}<div class="scene-cap">10 月 18 日 · 留存照片</div></div><div class="scene">${scene(false,4)}<div class="scene-cap">10 月 20 日 · 留存视频</div></div></div><p class="hint" style="margin-top:10px">影像只记录当时，不能确认现在有多少。</p></div>`;dock(secondary('更新位置','location')+primary('找到了','found'))}
function renderNew(){ $('#content').innerHTML=`<div class="eyebrow">新建记录</div><h2>核对一下，再记住。</h2><div class="quote"><small>你刚才说</small>“买了 3 包棉柔巾，放卫生间收纳柜。”</div><div class="field"><label for="newName">物品</label><input type="text" id="newName" value="棉柔巾" maxlength="40"></div><div class="field"><label for="newLocation">放在哪里</label><input type="text" id="newLocation" value="卫生间 / 收纳柜"></div><div class="field"><label for="newQty">数量</label><div class="quantity-fields">${step('newQty',state.newQty,1)}${unitSelect('newUnit',state.newUnit)}</div><p class="hint">按你说的预填，确认后保存。没有说数量时默认为 1 件。</p></div><details><summary>备注（选填）</summary><input type="text" placeholder="例如：未拆封" aria-label="物品备注"></details><div class="notice">这里已有一条棉柔巾记录，数量 5 包。</div><div class="stack" style="margin-top:12px"><label class="select-card"><input type="radio" name="existing" value="new" checked><span><b>新建一条记录</b><small>与已有物品分开保存</small></span></label><label class="select-card"><input type="radio" name="existing" value="existing"><span><b>修改已有的棉柔巾</b><small>先核对要增加，还是设为总数</small></span></label></div><p class="error" id="newError" role="alert"></p>`;dock(primary('确认记住','save-new'),'1 条记录 · 数量与位置均待你确认')}

function renderPhoto(){const n=state.selected.filter(Boolean).length;$('#content').innerHTML=`<div class="eyebrow">照片录入 / 核对候选</div><h2>这两包，怎么记？</h2><p class="sub">同类同位置，可以记在一起。</p><div class="scene section">${scene(true)}<div class="scene-cap">同一张来源照片 · 可展开查看</div></div>${state.photoMerged?`<div class="card section"><div class="row"><h3>棉柔巾</h3><span class="pill">${state.photoMode==='combined'?'1 条记录':'2 条独立记录'}</span></div><p class="sub">卫生间 / 收纳柜</p><div class="count-line" style="margin-top:14px"><b>${state.photoMode==='combined'?state.photoQty:1}</b><span>${state.photoMode==='combined'?'包':'包 / 每条'}</span></div><details><summary>查看 ${state.photoSources} 个来源候选</summary><p class="hint">${state.selected.map((v,i)=>v?`候选 ${i===0?'A':'B'}：照片${i===0?'左':'右'}侧包装`:null).filter(Boolean).join('<br>')}</p></details><div class="summary hint">${state.photoMode==='combined'?'保存整张照片留证，不用单个框代表两包。':'每条记录保留对应候选的照片标记。'}</div><button class="textbtn" data-act="undo-photo">撤销，重新核对</button></div>`:`<div class="section stack">${['左侧包装','右侧包装'].map((n,i)=>`<label class="select-card"><input type="checkbox" data-photo="${i}" ${state.selected[i]?'checked':''}><span><b>棉柔巾 · ${String.fromCharCode(65+i)}</b><small>${n} · 数量待核对</small></span><span class="pill">候选</span></label>`).join('')}</div><p class="hint section">名称相同不会自动合并。批号、用途或位置不同，可以分开记录。</p>`}`;dock(state.photoMerged?primary('确认保存示例','save-photo'):primary('核对选中的 '+n+' 个候选','group-photo',n===0),'原型演示 · 不写入真实物品')}

if(a==='group-photo')return photoSheet();if(a==='apply-photo'){const mode=$('input[name=photoMode]:checked').value,q=readQty('photoQty');if(mode==='combined'&&!validQty(q,1))return $('#photoError').textContent='请输入 1–9999 的整数。';state.photoMode=mode;state.photoQty=q;state.photoSources=state.selected.filter(Boolean).length;state.photoMerged=true;close();return render()};if(a==='undo-photo'){state.photoMerged=false;return render()};if(a==='save-photo')return toast('照片记录已确认（示例），完整来源保留');if(a==='video-group')return videoSheet();if(a==='uncertain')return toast('已保留待核对候选，尚未生成物品记录');
if(a==='apply-video'){if(state.videoMode==='combined'){const q=readQty('videoQty');if(!validQty(q,1))return $('#videoError').textContent='请输入 1–9999 的整数。';if(document.querySelectorAll('input[name=videoSource]:checked').length!==6)return $('#videoError').textContent='请逐条确认来源；若并非同一组实物，切换为两条独立物品。';state.videoQty=q}else{const v=[...document.querySelectorAll('[data-assign]')].map(e=>e.value);if(v.some(x=>!x)||!v.includes('a')||!v.includes('b'))return $('#videoError').textContent='请分配全部线索，并确保 A、B 都有来源。';state.assign=v}state.videoConfirmed=true;close();return render()};if(a==='save-video')return toast('已保存示例 · '+(state.videoMode==='combined'?'1 条记录':'2 条记录')+' · 6 条线索保留');
if(a==='refresh-conflict'){state.quantity=7;state.target='bath';state.voice='subtract';state.vMode='subtract';state.amount=2;go(2);toast('已刷新到 7 包，请重新核对 7 → 5');return};if(a==='refresh-unknown'){sheet(`<h3>结果仍待核对</h3><p class="sub">当前是 6 包，但期间还有其他修改，无法确定上一次减少是否成功。</p><p class="notice">未自动重试扣减。请按实物核对总数。</p>${primary('核对当前总数','unknown-set')}${secondary('稍后再核对','close')}`);return};if(a==='unknown-set'){state.legacy=false;return quantitySheet(false)};if(a==='fix-range'){state.voice='subtract';state.amount=6;state.quantity=5;state.target='bath';return go(2)}
});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='allVideoSources'){document.querySelectorAll('input[name=videoSource]').forEach(x=>x.checked=t.checked);return}if(t.id==='voiceScenario'){state.voice=t.value;state.target=state.voice==='ambiguous'?'':'bath';state.amount=state.voice==='set'?4:state.voice==='legacy'?1:2;state.vMode=(state.voice==='add'||state.voice==='ambiguous')?'add':state.voice==='set'?'set':'subtract';return render()}if(t.id==='boundaryScenario'){state.boundary=t.value;return render()}if(t.dataset.photo!==undefined){state.selected[Number(t.dataset.photo)]=t.checked;return renderPhoto()}if(t.name==='target'){state.target=t.value;return renderVoice()}if(t.name==='photoMode'){const split=t.value==='separate';$('#photoQty').disabled=split;document.querySelectorAll('[data-step=photoQty]').forEach(x=>x.disabled=split);$('#photoModeHint').textContent=split?'将分别建立 2 条记录，各 1 包，不合并。':'数字请按实物核对，不根据候选数直接保存。'}if(t.id==='amount'||t.id==='newQty'||t.id==='newUnit')valueChange(t.id)});
$('#back').onclick=()=>{if($('#overlay').innerHTML)return close();go(0)};$('#theme').onclick=()=>{state.dark=!state.dark;render()};$('#reset').onclick=()=>location.reload();
render();
</script></body></html>
