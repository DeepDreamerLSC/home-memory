<body>
<main class="workbench">
<aside class="intro"><div class="eyebrow">DETAIL STUDY · 2026.10</div><h1>一眼知道在哪。<br><span>每次只改一件事。</span></h1><p>把日常找物留在首屏，<br>修改时，再出现需要的选项。</p><nav class="scenes" aria-label="设计场景" id="scenes"></nav><p class="proposal-note" id="proposalNote"></p><div class="demo-controls"><button id="theme">◐ 深色</button><select id="scenario" aria-label="示例状态"><option value="normal">示例：普通详情</option><option value="unknown">旧记录 · 数量未知</option><option value="zero">数量为零</option><option value="unclassified">尚未归类</option><option value="pending">视频待关联</option><option value="conflict">位置更新冲突</option><option value="empty">暂无照片视频</option></select><button id="reset">重置</button></div><p style="font-size:10px">可点击原型 · 所有内容均为示例</p></aside>
<section class="phone" id="phone" aria-label="详情页交互原型"><div class="status"><span>9:41</span><span aria-hidden="true">▮▮▮　▰</span></div><div class="nav"><button id="back" aria-label="返回">‹</button><div class="nav-title">我靠东西呢</div><div class="capsule" aria-hidden="true">•••　│　◉</div></div><div class="content" id="content"></div><footer class="dock" id="dock"></footer><div id="overlay"></div><div id="toast" role="status" aria-live="polite"></div></section>
</main>
<script>
'use strict';
const $=s=>document.querySelector(s), esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const paths=['卫生间 / 收纳柜','卧室 / 衣柜','玄关 / 鞋柜'];
const unitOptions=['件','个','包','盒','瓶','袋','支','双','套','卷','张','本','罐','只'];
const fresh=()=>({name:'棉柔巾',path:paths[0],description:'下层，最右边的格子',quantity:5,unit:'包',due:'',notify:false,reminderDone:false,note:'未拆封，家庭备用',pending:false,photos:2,videos:1,conflict:false,updated:'10月26日',quantityUpdated:'10月26日'});
let item=fresh(), dark=false, activeScene='detail', view='detail', mediaTab='photo', mediaIndex=0, draft={}, returnFocus=null, toastTimer;
const icons={pin:'<path d="M16 9c0 5-6 10-6 10S4 14 4 9a6 6 0 1 1 12 0Z"/><circle cx="10" cy="9" r="2"/>',quantity:'<path d="m3 6 7-4 7 4v8l-7 4-7-4V6Zm0 0 7 4 7-4M10 10v8M6.5 4l7 4"/>',bell:'<path d="M15 7a5 5 0 0 0-10 0c0 6-2 6-2 7h14c0-1-2-1-2-7ZM8 17h4"/>',media:'<rect x="2" y="3" width="16" height="14" rx="3"/><circle cx="7" cy="8" r="1.5"/><path d="m3 15 5-4 3 2 3-4 4 6"/>'};
function icon(id){return `<svg class="icon" viewBox="0 0 20 20" aria-hidden="true">${icons[id]||icons.pin}</svg>`}
function pack(){return '<svg viewBox="0 0 60 60" aria-hidden="true"><path d="m11 24 29-5 10 8-29 6Z" fill="#e1d2a6" stroke="#7f866d" stroke-width="1.6"/><path d="m11 24 10 9v18l-10-9Z" fill="#cbd0bb" stroke="#7f866d" stroke-width="1.6"/><path d="m21 33 29-6v17l-29 7Z" fill="#f6f1db" stroke="#7f866d" stroke-width="1.6"/><path d="m25 38 17-3M25 43l13-3" stroke="#9ba584" stroke-width="2"/><path d="m19 23 3-12 10 3 10-3-2 9" fill="#fffdf3" stroke="#a4aa96" stroke-width="1.3"/></svg>'}
function scene(index=0){return `<svg viewBox="0 0 330 210" role="img" aria-label="历史影像示意：收纳柜里的棉柔巾，不是真实照片"><rect width="330" height="210" fill="#e4dfd1"/><rect x="25" y="20" width="280" height="170" rx="4" fill="#cac5b5" stroke="#999d88" stroke-width="2"/><path d="M25 117h280M25 180h280M180 20v160" stroke="#a1a38f" stroke-width="3"/><rect x="45" y="42" width="115" height="65" rx="4" fill="#eee9d8"/><path d="M55 54h90M55 64h65" stroke="#d4d0ba" stroke-width="4"/><rect x="${index===1?48:196}" y="${index===1?128:133}" width="${index===1?101:88}" height="43" rx="5" fill="#faf4dd" stroke="#929b7c" stroke-width="1.7"/><path d="M${index===1?'58 143h68m-68 8h42':'206 147h61m-61 8h40'}" stroke="#a2ac87" stroke-width="3"/><path d="M205 64c15-18 35-17 48 0v38h-48Z" fill="#b1b99a"/><text x="14" y="203" font-family="sans-serif" font-size="9" fill="#777d68">原型示意画面 · 非真实照片</text></svg>`}
function toast(message){clearTimeout(toastTimer);$('#toast').innerHTML=`<div class="toast">${esc(message)}</div>`;toastTimer=setTimeout(()=>$('#toast').innerHTML='',2600)}
function setDock(actions){$('#dock').innerHTML=`<div class="dock-actions">${actions}</div><div class="home-indicator"></div>`}
const primary=(label,act)=>`<button class="primary" data-act="${act}">${label}</button>`, secondary=(label,act)=>`<button class="secondary" data-act="${act}">${label}</button>`;
const sceneLabels=[['detail','详情首屏'],['location','更新位置'],['quantity','修改数量'],['reminder','到期提醒'],['media','照片与视频']];
const notes={detail:'把位置放在最前面。数量、提醒和留证各保留一个入口。',location:'直接修改位置，不用在长页面中寻找表单。归类与具体放法分开核对。',quantity:'数量单独核对，确认才保存。未知数量不填成 1，归零保留记录。',reminder:'日期和微信通知集中处理。提醒保持独立，不藏回物品编辑。',media:'照片、视频只用一个入口。查看影像时再展开片段与管理操作。'};
function renderNav(){ $('#scenes').innerHTML=sceneLabels.map(([id,name],i)=>`<button data-scene="${id}" aria-pressed="${activeScene===id}"><small>0${i+1}</small>${name}</button>`).join('');$('#proposalNote').textContent=notes[activeScene];$('#phone').classList.toggle('dark',dark);$('#theme').textContent=dark?'◐ 浅色':'◐ 深色'; }
function render(){clearTimeout(toastTimer);$('#toast').innerHTML='';renderNav();if(view==='search')return renderSearch();if(view==='deleted')return renderDeleted();const qty=item.quantity===null?'待核对':item.quantity===0?`<strong>0 ${esc(item.unit)}</strong> · 目前没有`:`<strong>${item.quantity} ${esc(item.unit)}</strong>`;const mediaText=item.pending?'有 1 段视频待关联':item.photos+item.videos===0?'添加留证':`${item.photos?item.photos+' 张照片':''}${item.photos&&item.videos?' · ':''}${item.videos?item.videos+' 段视频':''}`;
$('#content').innerHTML=`<div class="screen-fade"><div class="item-head"><div class="item-art">${pack()}</div><div class="item-name"><h2>${esc(item.name)}</h2><div class="quiet">我们家 · 家人可见</div></div><button class="more" data-act="more" aria-label="更多操作">⋯</button></div>${item.pending?'<div class="alert">有一段视频还没关联到这件物品。<button data-act="pending">查看并处理 ›</button></div>':''}<div class="location-card"><div class="label">上次记录位置</div><div class="place-path">${icon('pin')} ${esc(item.path||'尚未归类')}</div><div class="place-title">${esc(item.description)}</div><div class="record-time"><span>记录更新于 ${esc(item.updated)}</span><span>实际可能已移动</span></div></div><div class="detail-rows"><button class="detail-row" data-act="quantity">${icon('quantity')}<span class="row-label">数量</span><span class="row-value">${qty}</span><span class="chevron">›</span></button><button class="detail-row" data-act="reminder">${icon('bell')}<span class="row-label">到期提醒</span><span class="row-value">${item.due?esc(dateText(item.due))+' 到期':item.reminderDone?'已处理':'未设置'}</span><span class="chevron">›</span></button><button class="detail-row" data-act="media">${icon('media')}<span class="row-label">照片与视频</span><span class="row-value">${esc(mediaText)}</span><span class="chevron">›</span></button></div><p class="footnote">${item.quantity===null?'数量尚未确认，可点数量行补充。':`数量为 ${esc(item.quantityUpdated)} 确认值。`}影像仅记录当时。</p></div>`;
setDock(primary('✓ 找到了','found')+secondary('更新位置','location')); }
function dateText(value){const bits=value.split('-');return Number(bits[1])+'月'+Number(bits[2])+'日'}
function closeSheet(){ $('#overlay').innerHTML='';activeScene='detail';renderNav();if(returnFocus?.isConnected)returnFocus.focus(); }
function sheet(title,subtitle,body,actions=''){clearTimeout(toastTimer);$('#toast').innerHTML='';returnFocus=document.activeElement;$('#overlay').innerHTML=`<div class="modal-mask"><section class="sheet screen-fade" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="handle"></div><header class="sheet-head"><div><h3>${title}</h3>${subtitle?`<p class="helper">${subtitle}</p>`:''}</div><button class="close" data-act="close" aria-label="关闭面板">×</button></header><div class="sheet-scroll">${body}</div>${actions?`<footer class="sheet-actions">${actions}</footer>`:''}</section></div>`;$('#overlay .close').focus();}
function openLocation(){activeScene='location';draft={path:item.path,description:item.description};renderNav();sheet('放到哪里了？',esc(item.name),`${item.conflict?'<div class="alert">家人刚把位置更新为「卧室 / 衣柜 · 顶层」。你的修改尚未保存。<button data-act="use-latest">查看最新位置</button></div>':''}<div class="field"><label class="field-label" for="place">归类位置</label><select id="place"><option value="">暂不归类</option>${paths.map(p=>`<option ${p===item.path?'selected':''}>${esc(p)}</option>`).join('')}</select></div><div class="field"><label class="field-label" for="description">具体放在哪里</label><textarea id="description" maxlength="200" placeholder="例如：下层，最右边的格子">${esc(item.description)}</textarea></div><div class="preview"><div class="label">确认后记录为</div><p id="locationPreview">${esc(item.path||'未归类')}<br>${esc(item.description)}</p></div><p class="helper">只更新位置，数量、提醒和旧影像继续保留。</p><p class="error" id="locationError" role="alert"></p>`,secondary('取消','close')+primary('确认更新位置','save-location'));}
function locationPreview(){draft.path=$('#place').value;draft.description=$('#description').value;$('#locationPreview').innerHTML=esc(draft.path||'未归类')+'<br>'+esc(draft.description||'请补充具体位置');}
function openQuantity(){activeScene='quantity';draft={unit:item.unit};renderNav();sheet('现在有多少？',esc(item.name),`<div class="field"><label class="field-label" for="qty">当前总数</label><div class="number-fields"><div class="stepper"><button data-step="-1" aria-label="减少数量">−</button><input id="qty" type="number" inputmode="numeric" min="0" max="9999" step="1" value="${item.quantity===null?'':item.quantity}" placeholder="待核对"><button data-step="1" aria-label="增加数量">+</button></div><select id="unit" aria-label="数量单位">${unitOptions.map(u=>`<option ${u===item.unit?'selected':''}>${u}</option>`).join('')}</select></div></div><div class="preview"><div class="label">上次确认</div><p>${item.quantity===null?'尚未确认':item.quantity+' '+esc(item.unit)+' · '+esc(item.quantityUpdated)}</p></div><p class="helper" id="quantityHint">填 0 表示目前没有，物品记录仍然保留。</p><div id="unitCheck"></div><p class="error" id="quantityError" role="alert"></p>`,secondary('取消','close')+primary('确认数量','save-quantity'));}
function openReminder(){activeScene='reminder';renderNav();sheet('到期提醒',esc(item.name),`<div class="field"><label class="field-label" for="due">到期日期</label><input type="date" id="due" value="${item.due}" min="2026-10-27" max="2036-10-24"></div><p class="helper">设置后会出现在小程序的到期列表。</p><div class="mini-status"><div><div style="font-size:12px">微信消息提醒</div><p class="helper">${item.notify?'已开启（演示状态）':'需在微信中单独开启'}</p></div><button class="text-link" data-act="notify">${item.notify?'查看':'开启'}微信提醒</button></div>${item.due?'<div class="mini-status"><button class="text-link" data-act="done-reminder">已处理这次提醒</button><button class="text-link danger" data-act="clear-reminder">清除提醒</button></div>':''}<p class="error" id="reminderError" role="alert"></p>`,secondary('取消','close')+primary('确认日期','save-reminder'));}
function openMedia(tab='photo',index=0){activeScene='media';mediaTab=tab;mediaIndex=index;renderNav();const isPhoto=tab==='photo',count=isPhoto?item.photos:item.videos;const body=`${item.pending?'<div class="alert">视频已上传，尚未关联。<button data-act="retry-pending">重试关联</button><button data-act="discard-pending">删除待关联视频</button></div>':''}<div class="media-tabs" role="tablist" aria-label="留证类型"><button role="tab" data-media="photo" aria-selected="${isPhoto}" class="${isPhoto?'active':''}">照片 ${item.photos}</button><button role="tab" data-media="video" aria-selected="${!isPhoto}" class="${!isPhoto?'active':''}">视频 ${item.videos}</button></div>${count?`<div class="media-stage">${scene(index)}${isPhoto?'':'<button class="video-play" data-act="play" aria-label="播放示意视频">▶</button><span class="video-time">00:02 / 00:18</span>'}</div><div class="media-caption">10月${index===1?'18':'24'}日${isPhoto?'拍摄':'录制'} · 当时在卫生间收纳柜<br>${item.path!==paths[0]?'位置已更新，这份影像保留的是旧记录。':'影像只说明当时，不代表现在的位置和数量。'}</div>${isPhoto?`<div class="media-thumbs">${Array.from({length:item.photos},(_,i)=>`<button class="media-thumb ${index===i?'selected':''}" data-photo="${i}" aria-label="第 ${i+1} 张照片">${scene(i)}</button>`).join('')}</div>`:'<div class="preview"><div class="label">你确认过的片段</div><button class="text-link" data-act="seek">00:02–00:05　棉柔巾</button><p class="helper">定位后保持暂停，由你点击播放。</p></div>'}<div class="media-actions"><button data-act="add-media">${isPhoto?'补拍一张':'添加视频'}</button><button data-act="media-manage">管理${isPhoto?'照片':'视频'}</button></div>`:`<div class="success-view"><div class="success-mark">${isPhoto?'▧':'▷'}</div><h3>还没有${isPhoto?'照片':'视频'}留证</h3><p class="helper">当前的位置记录仍然可用。</p></div>${primary(isPhoto?'拍一张留证照片':'添加一段视频','add-media')}`}`;sheet('照片与视频',esc(item.name),body);}
function openMore(){sheet('更多',esc(item.name),`<button class="menu-row" data-act="edit-info">编辑名称与备注 <span>›</span></button><div class="menu-row"><span>共享状态</span><span class="pill">家人可见</span></div><button class="menu-row danger" data-act="delete-item">删除这条记录 <span>›</span></button><p class="helper">位置、数量和提醒可直接在详情页修改。</p>`);}
function openInfo(){sheet('名称与备注','',`<div class="field"><label class="field-label" for="name">名称</label><input id="name" maxlength="50" value="${esc(item.name)}"></div><div class="field"><label class="field-label" for="note">备注</label><textarea id="note" maxlength="200">${esc(item.note)}</textarea></div><p class="helper">原备注保持原文，不据其中的数字计算数量。</p><p class="error" id="infoError" role="alert"></p>`,secondary('取消','close')+primary('保存修改','save-info'));}
function renderSearch(){activeScene='detail';renderNav();$('#content').innerHTML=`<div class="state-label">找东西</div><h2>棉柔巾</h2><p class="helper">已返回查找结果</p><button class="search-result" data-act="detail"><span class="item-art">${pack()}</span><span><b>${esc(item.name)}</b><small>${esc(item.path||'未归类')} · ${esc(item.description)}</small></span></button>`;setDock(secondary('回到示例详情','detail'));}
function renderDeleted(){activeScene='detail';renderNav();$('#content').innerHTML='<div class="success-view"><div class="success-mark">✓</div><h3>示例记录已移除</h3><p class="helper">没有删除任何真实物品。<br>点击重置可恢复这条示例。</p></div>';setDock(primary('重置示例','reset'));}
function finish(message){closeSheet();render();toast(message)}
function openScene(id){if(view!=='detail')view='detail';closeSheet();render();if(id==='detail')return;if(id==='location')openLocation();if(id==='quantity')openQuantity();if(id==='reminder')openReminder();if(id==='media')openMedia();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.scene)return openScene(b.dataset.scene);if(b.dataset.media)return openMedia(b.dataset.media);if(b.dataset.photo!==undefined)return openMedia('photo',Number(b.dataset.photo));if(b.dataset.step){const input=$('#qty');input.value=Math.max(0,Math.min(9999,Number(input.value||0)+Number(b.dataset.step)));return}const act=b.dataset.act;
if(act==='close')return closeSheet();if(act==='location')return openLocation();if(act==='quantity')return openQuantity();if(act==='reminder')return openReminder();if(act==='media')return openMedia();if(act==='pending')return openMedia('video');if(act==='more')return openMore();if(act==='edit-info')return openInfo();
if(act==='found'){closeSheet();view='search';return render()}if(act==='detail'){view='detail';return render()}
if(act==='save-location'){locationPreview();if(!draft.description.trim())return $('#locationError').textContent='请补充具体放在哪里。';if(item.conflict)return $('#locationError').textContent='请先查看家人更新的位置，再重新确认。';item.path=draft.path;item.description=draft.description.trim();item.updated='刚刚';return finish('位置已更新（示例）')}
if(act==='use-latest'){const previous={path:$('#place').value,description:$('#description').value};item.path=paths[1];item.description='顶层，左侧收纳盒';item.updated='刚刚';item.conflict=false;render();openLocation();$('#place').value=previous.path;$('#description').value=previous.description;locationPreview();$('#overlay .sheet-scroll').insertAdjacentHTML('afterbegin','<div class="alert">最新位置：卧室 / 衣柜 · 顶层，左侧收纳盒。<br>下方保留你的修改，请核对后再确认。</div>');return}
if(act==='save-quantity'){const raw=$('#qty').value,n=Number(raw);if(raw.trim()===''||!Number.isInteger(n)||n<0||n>9999)return $('#quantityError').textContent='请输入 0–9999 的整数。';if($('#unit').value!==item.unit&&!$('#unitVerified')?.checked)return $('#quantityError').textContent='更换单位后，请重新核对总数并勾选确认。';item.quantity=n;item.unit=$('#unit').value;item.quantityUpdated='刚刚';return finish(n===0?'已记为目前没有，物品记录保留（示例）':'数量已更新（示例）')}
if(act==='save-reminder'){const d=$('#due').value;if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||d<'2026-10-27'||d>'2036-10-24')return $('#reminderError').textContent='请选择今天起、十年内的有效日期。';item.due=d;item.reminderDone=false;return finish('到期日期已保存（示例）')}
if(act==='notify')return toast('真机将由这次点击申请微信授权；原型不申请权限');
if(act==='clear-reminder'){sheet('清除这条提醒？','物品和留证都会保留。','<p class="helper">只清除当前物品的到期提醒。</p>',secondary('取消','reminder')+primary('确认清除','confirm-clear'));return}
if(act==='confirm-clear'){item.due='';item.notify=false;item.reminderDone=false;return finish('提醒已清除（示例）')}
if(act==='done-reminder'){sheet('这次提醒处理好了？',esc(item.name),'<p class="helper">只标记提醒已处理，不扣减数量，也不删除物品。</p>',secondary('取消','reminder')+primary('确认已处理','confirm-done'));return}if(act==='confirm-done'){item.due='';item.notify=false;item.reminderDone=true;return finish('提醒已处理，物品和数量未改变（示例）')}if(act==='save-info'){if(!$('#name').value.trim())return $('#infoError').textContent='请填写物品名称。';item.name=$('#name').value.trim();item.note=$('#note').value;return finish('名称与备注已保存（示例）')}
if(act==='retry-pending'){item.pending=false;item.videos++;openMedia('video');render();toast('已关联到这条示例记录');return}
if(act==='discard-pending'){sheet('删除待关联视频？','只处理这段未关联的示例视频。','<p class="helper">已关联的影像和物品记录不会受影响。</p>',secondary('取消','pending')+primary('确认删除','confirm-discard'));return}
if(act==='confirm-discard'){item.pending=false;finish('待关联示例已移除');return}
if(act==='play')return toast('这是视频示意画面，不会播放真实视频');if(act==='seek')return toast('已定位到 00:02，保持暂停（示例）');if(act==='add-media')return toast('真机将进入拍摄或选择文件；本原型不调用相机');if(act==='media-manage')return toast('查看与管理在此处理，详情首屏保持简洁');
if(act==='delete-item'){sheet('删除这条记录？',esc(item.name),'<p class="helper">正式产品会按既有规则处理关联留证。此处仅移除浏览器内的示例。</p>',secondary('取消','more')+primary('确认删除示例','confirm-delete'));return}
if(act==='confirm-delete'){closeSheet();view='deleted';return render()}if(act==='reset')return reset();
});
document.addEventListener('input',e=>{if(e.target.id==='place'||e.target.id==='description')locationPreview()});
document.addEventListener('change',e=>{if(e.target.id==='place')locationPreview();if(e.target.id==='unit'){$('#unitCheck').innerHTML=e.target.value===item.unit?'':'<label class="check-row"><input type="checkbox" id="unitVerified"><span>我已按新单位重新核对当前总数</span></label>';$('#quantityError').textContent=''}});
document.addEventListener('keydown',e=>{const dialog=$('#overlay [role=dialog]');if(!dialog)return;if(e.key==='Escape'){e.preventDefault();closeSheet()}if(e.key==='Tab'){const focusable=[...dialog.querySelectorAll('button,input,textarea,select')].filter(x=>!x.disabled);const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});
$('#back').onclick=()=>{if($('#overlay').innerHTML)return closeSheet();view=view==='detail'?'search':'detail';render()};$('#theme').onclick=()=>{dark=!dark;renderNav()};
function reset(){item=fresh();view='detail';mediaTab='photo';mediaIndex=0;$('#scenario').value='normal';closeSheet();render()}
$('#reset').onclick=reset;$('#scenario').onchange=e=>{item=fresh();view='detail';closeSheet();switch(e.target.value){case'unknown':item.quantity=null;item.note='×3　500ml，旧备注保留';break;case'zero':item.quantity=0;break;case'unclassified':item.path='';break;case'pending':item.pending=true;break;case'conflict':item.conflict=true;break;case'empty':item.photos=0;item.videos=0;break;}render();if(e.target.value==='conflict')openLocation()};
render();
</script></body></html>
