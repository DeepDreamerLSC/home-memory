<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>位置插画 · 第一版</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f1f0e9;color:#30372c}button,input{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible{outline:2px solid #8b774a;outline-offset:4px}button{border:0}header{max-width:1392px;margin:auto;padding:44px 42px 30px;display:flex;justify-content:space-between;gap:28px;align-items:end}.eyebrow{font-size:11px;letter-spacing:2px;color:#797d70}h1{font-size:30px;line-height:1.4;letter-spacing:-1px;font-weight:550;margin:12px 0 10px}.intro{margin:0;color:#747a6a;font-size:13px}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.swatch{width:34px;height:34px;border:4px solid #f1f0e9;border-radius:50%;box-shadow:0 0 0 1px #d7d9ce;background:var(--swatch)}.swatch[aria-pressed=true]{box-shadow:0 0 0 2px #69715d}.mode{background:#e6e7dc;border:1px solid #d8dbce;border-radius:100px;padding:6px 13px;margin-left:7px;font-size:12px}.layout{max-width:1392px;margin:auto;padding:0 42px 56px;display:grid;grid-template-columns:minmax(0,1fr) 352px;gap:50px;align-items:start}.library{min-width:0}.tabs{display:flex;gap:8px;border-bottom:1px solid #d9dbd0;padding:0 0 20px;margin-bottom:26px}.tab{border:1px solid transparent;border-radius:100px;padding:8px 17px;background:transparent;font-size:13px;color:#707967}.tab[aria-selected=true]{background:#30372c;color:#f9f8f2}.tab small{margin-left:7px;opacity:.65}section{margin-bottom:32px}.group-heading{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}h2{font-size:17px;margin:0;font-weight:550}.group-heading span{font-size:12px;color:#828675}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.art-card{overflow:hidden;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:0;transition:box-shadow .15s,transform .15s;color:var(--ink)}.art-card:hover{transform:translateY(-2px)}.art-card[aria-pressed=true]{box-shadow:0 0 0 2px var(--strong)}.art{background:var(--wash);display:flex;align-items:center;justify-content:center;aspect-ratio:1.55}.art svg{width:100%;height:100%;max-height:150px;display:block}.art-label{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;font-size:12px}.selected-mark{opacity:0;color:var(--strong);font-size:14px}.art-card[aria-pressed=true] .selected-mark{opacity:1}.note{color:#7d8373;font-size:12px;line-height:1.85;margin:20px 0}.preview{position:sticky;top:26px}.preview-label{display:flex;justify-content:space-between;font-size:11px;color:#747a68;margin-bottom:12px;letter-spacing:1px}.phone{background:var(--paper);color:var(--ink);border:6px solid var(--card);border-radius:38px;box-shadow:0 0 0 1px #d2d5c8,0 16px 40px #343d2710;overflow:hidden}.status{height:28px;display:flex;justify-content:space-between;padding:6px 20px 0;font-size:10px;font-weight:600}.nav{height:43px;display:grid;grid-template-columns:70px 1fr 70px;align-items:center;padding:0 12px;font-size:11px;text-align:center}.nav-capsule{border:1px solid var(--line);border-radius:20px;letter-spacing:2px;font-size:13px;height:25px;line-height:23px}.phone-content{padding:22px 18px 0}.phone-heading{display:flex;justify-content:space-between;align-items:center}.phone-heading h3{font-size:25px;font-weight:600;margin:0}.phone-actions{display:flex;gap:14px;align-items:center}.phone-actions span{font-size:23px;font-weight:300}.avatar{width:31px;height:31px;border:1px solid var(--line);background:var(--wash);border-radius:50%;display:grid;place-items:center;font-size:12px;color:var(--muted)}.phone-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;margin-top:9px}.search{border:1px solid var(--line);background:var(--card);border-radius:14px;display:flex;align-items:center;gap:9px;padding:5px 6px 5px 12px;margin:22px 0 20px;color:var(--muted);font-size:11px;height:44px}.search span:first-child{font-size:18px}.search-go{margin-left:auto;background:var(--strong);color:var(--paper);border-radius:9px;width:32px;height:32px;font-size:22px;text-align:center;line-height:30px}.phone-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.phone-card{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--card)}.phone-card.active{box-shadow:0 0 0 1px var(--strong)}.phone-card .art{aspect-ratio:1.4}.phone-card .art svg{width:100%;height:100%}.phone-card .copy{padding:10px 11px;display:flex;align-items:center;justify-content:space-between}.phone-card .name{font-size:12px;font-weight:500}.phone-card .count{font-size:9px;margin-top:2px;color:var(--muted)}.chevron{font-size:18px;color:var(--muted)}.voice{display:flex;gap:8px;align-items:center;margin:20px 13px 0;padding-top:9px;border-top:1px solid var(--line)}.voice-main{flex:1;background:var(--strong);color:var(--paper);font-size:12px;letter-spacing:1px;padding:12px;text-align:center;border-radius:14px}.voice-add{border:1px solid var(--line);background:var(--card);width:44px;height:43px;border-radius:14px;text-align:center;font-size:23px;font-weight:300}.home-indicator{width:100px;height:4px;background:var(--ink);border-radius:9px;margin:10px auto 7px}.mapping{margin-top:22px;border-top:1px solid #d5d9ca;padding-top:18px}.mapping label{display:block;font-size:12px;color:#6c7461;margin-bottom:8px}.input-row{display:flex;gap:9px}.input-row input{min-width:0;width:100%;padding:9px 12px;border:1px solid #d1d6c7;border-radius:10px;background:#fbfaf5;color:#30372c;font-size:13px}.input-row button{white-space:nowrap;background:#e3e6d9;border-radius:10px;padding:0 12px;font-size:12px}.mapping-state{margin-top:10px;font-size:12px;color:#656f5c}.mapping-state strong{font-weight:500;color:#343f2e}.mapping-help{font-size:11px;color:#838a79;margin-top:6px;line-height:1.8}.jump-preview{display:none}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);border-radius:20px;background:#30372c;color:#f9f8f1;padding:9px 20px;font-size:12px;box-shadow:0 6px 25px #27311c22}.toast[hidden]{display:none}
[data-art-theme]{--paper:#f8f7f2;--card:#fffefa;--ink:#292d25;--muted:#717765;--line:#e3e6da;--wash:#efeee4;--strong:#6f7c60;--art-line:#7b8069;--art-mid:#d3d5bf;--art-light:#f8f6e9;--art-dark:#a9ae91;--art-accent:#ddc486}
[data-art-theme=apricot]{--paper:#fcf6ed;--card:#fffaf4;--ink:#493a30;--muted:#95806c;--line:#eadbc9;--wash:#f1e6d7;--strong:#a86b48;--art-line:#987a62;--art-mid:#dfc4a5;--art-light:#fff5e4;--art-dark:#b99b7b;--art-accent:#d99563}
[data-art-theme=ocean]{--paper:#f3f7f7;--card:#fcffff;--ink:#223f46;--muted:#6d8990;--line:#d5e3e4;--wash:#e4eff0;--strong:#356b79;--art-line:#62848d;--art-mid:#bcd7dc;--art-light:#f3fbfc;--art-dark:#83abb5;--art-accent:#d9bc78}
[data-art-theme][data-mode=dark]{--paper:#20271f;--card:#2b3328;--ink:#ecefe1;--muted:#afb9a1;--line:#424d39;--wash:#303b2b;--strong:#ced8b7;--art-line:#adb998;--art-mid:#627752;--art-light:#909e77;--art-dark:#435539;--art-accent:#bda369}
@media(min-width:1500px){header,.layout{max-width:1500px}.grid{gap:18px}.layout{gap:70px}}
@media(max-width:1060px){header{padding:30px 24px 24px}.layout{padding:0 24px 35px;gap:28px;grid-template-columns:minmax(0,1fr) 320px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}h1{font-size:25px}}
@media(max-width:760px){header{align-items:start;flex-direction:column;gap:16px}.layout{display:flex;flex-direction:column;gap:32px}.jump-preview{display:block;padding:7px 13px;border:1px solid #d1d6c7;border-radius:100px;font-size:12px;background:transparent}.preview{position:static;width:min(352px,100%);align-self:center}.preview-label{margin-top:0}.mapping{margin-top:17px}.library{width:100%}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.art-label{padding:8px 10px}.art{aspect-ratio:1.25}.group-heading span{font-size:11px}h1{font-size:25px}.tabs{position:sticky;top:0;background:#f1f0e9;z-index:1;padding:12px 0}}
</style>
</head>
<body>
<header><div><div class="eyebrow">HOME MEMORY · 位置插画 01</div><h1>一眼认出不同位置</h1><p class="intro">24 款预置插画 · 空间 / 家具 / 收纳。点选任意一张，查看卡片中的效果。</p></div><div class="controls" aria-label="预览配色"><button class="swatch" style="--swatch:#8a9875" data-theme="sage" aria-label="苔绿" aria-pressed="true"></button><button class="swatch" style="--swatch:#c58b60" data-theme="apricot" aria-label="暖杏" aria-pressed="false"></button><button class="swatch" style="--swatch:#5d8b99" data-theme="ocean" aria-label="深海" aria-pressed="false"></button><button class="mode" id="mode" aria-pressed="false">深色预览</button><button class="jump-preview" id="jump-preview">查看卡片效果 ↓</button></div></header>
<main class="layout"><div class="library" data-art-theme="sage" data-mode="light"><nav class="tabs" role="tablist" aria-label="插画分类"><button role="tab" class="tab" aria-selected="true" data-category="全部">全部<small>24</small></button><button role="tab" class="tab" aria-selected="false" data-category="空间">空间<small>8</small></button><button role="tab" class="tab" aria-selected="false" data-category="家具">家具<small>8</small></button><button role="tab" class="tab" aria-selected="false" data-category="收纳">收纳<small>8</small></button></nav><div id="catalog"></div><p class="note">分类用于组织图册，无需用户预先填写。名称自动匹配，手动选择的插画优先保留。<br>这是设计预览，页面内均为示例数据。</p></div><aside class="preview"><div class="preview-label"><span>小程序卡片预览</span><span id="selection-count">01 / 24</span></div><div class="phone" data-art-theme="sage" data-mode="light"><div class="status"><span>9:41</span><span>▰ ▮▮</span></div><div class="nav"><span></span><span>我靠东西呢</span><span class="nav-capsule">··· ◉</span></div><div class="phone-content"><div class="phone-heading"><h3>家里</h3><div class="phone-actions"><span>＋</span><div class="avatar">林</div></div></div><div class="phone-meta"><span>已记住 43 件</span><span>● 我们家 ⌄</span></div><div class="search"><span>⌕</span><span>搜索物品</span><span class="search-go">→</span></div><div class="phone-grid" id="phone-grid"></div></div><div class="voice"><div class="voice-main">●　按住说话</div><div class="voice-add">＋</div></div><div class="home-indicator"></div></div><div class="mapping"><label for="location-name">试一个你的位置名称</label><div class="input-row"><input id="location-name" value="书房" maxlength="50" autocomplete="off" placeholder="例如：床头柜、工具箱"><button id="reset">自动匹配</button></div><div class="mapping-state" id="mapping-state" aria-live="polite"></div><div class="mapping-help">修改名称会自动选图；点左侧图册可手动换图。<br>这里只改变插画，不改变位置层级。</div></div></aside></main>
<div class="toast" id="toast" role="status" hidden></div>
<script src="spaces.js"></script><script src="furniture.js"></script><script src="containers.js"></script>
<script>
'use strict';
const items=[...window.LOCATION_SPACES,...window.LOCATION_FURNITURE,...window.LOCATION_CONTAINERS];
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let selected='study',manual=false,category='全部',theme='sage',dark=false;
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function svg(item){return `<svg viewBox="0 0 180 120" role="img" aria-label="${escapeHtml(item.name)}插画">${item.body}</svg>`}
function matchName(name){const n=name.trim().toLowerCase();return items.filter(i=>i.id!=='generic').flatMap(i=>i.keywords.filter(k=>n.includes(k.toLowerCase())).map(k=>({item:i,length:k.length}))).sort((a,b)=>b.length-a.length)[0]?.item||items.find(i=>i.id==='generic')}
function render(){
 $('#catalog').innerHTML=['空间','家具','收纳'].filter(g=>category==='全部'||category===g).map(g=>`<section><div class="group-heading"><h2>${g}</h2><span>${{空间:'用场景和代表物区分',家具:'用轮廓和结构区分',收纳:'用材质与开合方式区分'}[g]}</span></div><div class="grid">${items.filter(i=>i.category===g).map(i=>`<button class="art-card" data-id="${i.id}" aria-label="选择${i.name}插画" aria-pressed="${selected===i.id}"><div class="art">${svg(i)}</div><div class="art-label"><span>${i.name}</span><span class="selected-mark" aria-hidden="true">✓</span></div></button>`).join('')}</div></section>`).join('');
 const chosen=items.find(i=>i.id===selected);const name=$('#location-name').value.trim()||'我的位置';
 const examples=[{item:chosen,name,count:14},...['living','bedroom','kitchen','wardrobe','storage-box','bathroom','carton'].filter(id=>id!==selected).slice(0,5).map((id,i)=>({item:items.find(x=>x.id===id),name:items.find(x=>x.id===id).name,count:[8,3,6,2,4][i]}))];
 $('#phone-grid').innerHTML=examples.map((x,i)=>`<div class="phone-card ${i===0?'active':''}"><div class="art">${svg(x.item)}</div><div class="copy"><div><div class="name">${escapeHtml(x.name)}</div><div class="count">${x.count} 件</div></div><span class="chevron">›</span></div></div>`).join('');
 $('#mapping-state').innerHTML=`${manual?'手动选择':'自动匹配'}：<strong>${escapeHtml(chosen.name)}</strong> <span>· ${chosen.category}</span>`;
 $('#selection-count').textContent=`${String(items.indexOf(chosen)+1).padStart(2,'0')} / 24`;
}
$('#catalog').addEventListener('click',e=>{const card=e.target.closest('[data-id]');if(!card)return;selected=card.dataset.id;manual=true;render()});
$('#location-name').addEventListener('input',()=>{selected=matchName($('#location-name').value).id;manual=false;render()});
$('#reset').addEventListener('click',()=>{selected=matchName($('#location-name').value).id;manual=false;render()});
$$('.tab').forEach(b=>b.addEventListener('click',()=>{category=b.dataset.category;$$('.tab').forEach(x=>x.setAttribute('aria-selected',String(x===b)));render();window.scrollTo({top:0,behavior:'instant'})}));
$$('.swatch').forEach(b=>b.addEventListener('click',()=>{theme=b.dataset.theme;$$('[data-art-theme]').forEach(x=>x.dataset.artTheme=theme);$$('.swatch').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}));
$('#jump-preview').addEventListener('click',()=>$('.preview').scrollIntoView({behavior:'smooth',block:'start'}));
$('#mode').addEventListener('click',()=>{dark=!dark;$$('[data-art-theme]').forEach(x=>x.dataset.mode=dark?'dark':'light');$('#mode').setAttribute('aria-pressed',String(dark));$('#mode').textContent=dark?'浅色预览':'深色预览'});
render();
</script>
</body></html>
