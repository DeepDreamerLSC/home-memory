name: test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm test
        # pretest 自动 npm run build:mp(tsc 编译),随后跑全部离线测试(node:test)
